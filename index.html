<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="홍상수 영화 같은 밤 술집. 걸어 다니다 아무 테이블에나 앉아 술을 따르고, 마시고, 담배 피우고, 고백한다.">
<title>어느 밤 술집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed 3D canvas you walk through; thin status row on top, plain subtitle strip low, actions or a sit prompt at the bottom. Single committed night look. */
:root{
  --night:#110e0c;
  --panel:rgba(17,14,12,.74);
  --paper:#f2eadf;
  --muted:#a7998a;
  --soju:#5fae7c;
  --lamp:#efb45b;
  --rose:#d9786b;
  --line:rgba(242,234,223,.16);
  --f-title:"Gowun Batang","Nanum Myeongjo",serif;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px}
html,body{height:100%;background:var(--night);color:var(--paper);overflow:hidden}
body{font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter .8s}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}

#labels,#tags{position:fixed;inset:0;pointer-events:none}
.tlabel{position:absolute;transform:translate(-50%,-100%);text-align:center;transition:opacity .4s;white-space:nowrap}
.tlabel b{display:block;font-family:var(--f-title);font-size:14px;font-weight:700;text-shadow:0 1px 4px #000,0 0 2px #000}
.tlabel span{display:block;font-size:11.5px;color:#d8cbb9;text-shadow:0 1px 3px #000}
.ptag{position:absolute;transform:translate(-50%,-100%);text-align:center;max-width:220px}
.ptag b{display:inline-block;font-size:12px;font-weight:400;background:rgba(17,14,12,.7);border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--lamp)}
.ptag p{margin:4px 0 0;font-family:var(--f-title);font-size:13.5px;line-height:1.35;background:rgba(242,234,223,.92);color:#1c1714;border-radius:4px;padding:4px 8px;white-space:normal}

#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:10px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;flex-wrap:wrap}
#top>*{pointer-events:auto}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 12px;font-size:13px}
.ghost:hover{border-color:var(--paper)}
#chips{display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 120px)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:6px 11px 7px;text-align:left;min-width:108px}
.chip[aria-pressed="true"]{border-color:var(--lamp);box-shadow:inset 0 -2px 0 var(--lamp)}
.chip b{font-family:var(--f-title);font-size:14px}
.chip small{color:var(--muted);font-size:11px;margin-left:5px}
.chip.person b{color:var(--lamp)}
.meters{display:grid;grid-template-columns:auto auto;gap:2px 8px;margin-top:4px;font-size:10.5px;color:var(--muted);align-items:center}
.dots{letter-spacing:2px;font-size:9px;color:var(--line)}
.dots i{font-style:normal}
.dots i.on{color:var(--soju)}
.dots.heart i.on{color:var(--rose)}
#side{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#me{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:6px 11px;font-size:11px;color:var(--muted)}
#me .dots i.on{color:var(--lamp)}
#online{color:var(--paper)}
#sideBtns{display:flex;gap:6px}
#sideBtns .ghost{font-size:12px;padding:5px 10px}
#hint{font-size:12px;color:var(--muted);text-shadow:0 1px 3px #000;pointer-events:none;line-height:1.5}
#hint b{color:var(--paper);font-weight:400}

#chatBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));width:min(520px,calc(100% - 32px));display:flex;gap:6px}
#chatBar input{flex:1;min-width:0;background:rgba(17,14,12,.88);border:1px solid var(--lamp);border-radius:3px;padding:10px 12px;font-size:15px;user-select:text;-webkit-user-select:text}
#chatBar button{background:var(--lamp);color:#1c1714;border:0;border-radius:3px;padding:0 14px;font-size:14px}

#sub{position:fixed;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;opacity:0;transition:opacity .25s}
#sub.on{opacity:1}
#sub.far{opacity:.62}
#sub p{margin:0;max-width:34em;text-align:center;font-family:var(--f-title);font-size:clamp(17px,2.3vw,23px);line-height:1.5;text-shadow:0 0 2px #000,0 2px 8px rgba(0,0,0,.9);text-wrap:balance}
#sub .who{display:block;font-family:var(--f-ui);font-size:12px;color:var(--lamp);letter-spacing:.08em;margin-bottom:2px}
#sub.person .who{color:#9fd6b4}

#actions{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:clamp(8px,3vw,22px);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;background:linear-gradient(to top,rgba(17,14,12,.85),rgba(17,14,12,0))}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:74px;transition:opacity .2s,transform .15s}
.act .ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);transition:border-color .2s,background .2s}
.act svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.act span{font-size:12.5px;white-space:nowrap}
.act:hover:not(:disabled) .ring{border-color:var(--paper);background:rgba(40,33,28,.9)}
.act:active:not(:disabled){transform:scale(.94)}
.act[data-act="pour"] .ring{color:var(--soju)}
.act[data-act="drink"] .ring{color:var(--lamp)}
.act[data-act="smoke"] .ring{color:#c9c1b6}
.act[data-act="confess"] .ring{color:var(--rose)}
.act:disabled{opacity:.38;cursor:default}

.bottomBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:15px;padding:11px 22px;text-align:center}
#sit b{font-family:var(--f-title);font-weight:700}
#sit small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
kbd{font-family:var(--f-ui);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:6px;color:var(--muted)}
#invite{position:fixed;left:50%;transform:translateX(-50%);top:calc(130px + env(safe-area-inset-top,0px));background:rgba(17,14,12,.9);border:1px solid var(--lamp);border-radius:3px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:calc(100% - 32px)}
#invite button{background:var(--lamp);color:#1c1714;border:0;border-radius:3px;padding:6px 12px}
#invite .x{background:none;color:var(--muted);padding:6px 4px}

#joy{position:fixed;left:max(22px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:rgba(17,14,12,.35);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(242,234,223,.22);border:1px solid rgba(242,234,223,.35)}

#dissolve{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
#bwBtn[aria-pressed="true"]{border-color:var(--paper)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#place{position:fixed;top:38%;left:0;right:0;text-align:center;font-family:var(--f-title);font-size:20px;letter-spacing:.2em;opacity:0;transition:opacity .8s;pointer-events:none;text-shadow:0 2px 10px #000}

#card{position:fixed;inset:0;display:grid;place-items:center;background:rgba(31,54,48,.93);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .9s;overflow:auto}
#card.out{opacity:0;pointer-events:none}
#card .in{max-width:30em;text-align:center;padding-block:24px}
#card h1{font-family:var(--f-title);font-weight:400;font-size:clamp(34px,7vw,56px);margin:0;letter-spacing:.06em;text-wrap:balance}
#card .sub{margin:14px 0 0;color:#cfe0d6;font-size:14px;letter-spacing:.1em}
#card ul{list-style:none;padding:0;margin:26px auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px;max-width:22em;text-align:left;font-size:13.5px;color:#e2ece6}
#card li b{color:var(--paper);font-weight:400;font-family:var(--f-title)}
#card .how{margin:20px 0 0;font-size:13px;color:#cfe0d6;line-height:1.7}
#card label{display:block;margin-top:22px;font-size:12px;color:#cfe0d6;letter-spacing:.08em}
#card #nick{display:block;margin:6px auto 0;width:12em;max-width:100%;text-align:center;background:rgba(0,0,0,.2);border:1px solid #9fbcae;border-radius:2px;padding:9px 10px;font-size:16px;font-family:var(--f-title);user-select:text;-webkit-user-select:text}
#card .start{margin-top:18px;background:none;border:1px solid #e2ece6;border-radius:2px;padding:11px 26px;font-size:15px;letter-spacing:.1em}
#card .start:hover{background:rgba(255,255,255,.08)}
#card .fine{margin-top:14px;font-size:11.5px;color:#a9c2b5;line-height:1.6}

@media (max-width:520px){
  .act{width:62px}.act .ring{width:50px;height:50px}.act span{font-size:11.5px}
  #sub{bottom:calc(108px + env(safe-area-inset-bottom,0px))}
  .chip{min-width:0;padding:5px 8px}
  body.walk #sub{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
  #sit{left:auto;right:max(16px,env(safe-area-inset-right,0px));transform:none;bottom:calc(60px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#c,#fade,#card,#place,#sub{transition:none}}
</style>
</head>
<body>

<canvas id="c" aria-label="술집 3D 공간"></canvas>
<div id="labels"></div>
<div id="tags"></div>

<div id="top">
  <button class="ghost" id="leave" hidden>← 일어나기</button>
  <div id="chips" hidden></div>
  <div id="hint" hidden></div>
  <div id="side" hidden>
    <div id="me"><div class="meters"><span>나의 취기</span><span id="meDots"></span><span>내 잔</span><span id="myGlass">비었음</span><span>같이 있는 사람</span><span id="online">나 혼자</span></div></div>
    <div id="sideBtns"><button class="ghost" id="talkBtn">말하기<kbd>T</kbd></button><button class="ghost" id="bwBtn" aria-pressed="false">흑백</button><button class="ghost" id="soundBtn" aria-pressed="true">소리 켬</button></div>
  </div>
</div>
<form id="chatBar" hidden><input id="chatIn" maxlength="80" autocomplete="off" placeholder="한마디 하기 (Enter로 보내기)"><button type="submit">말하기</button></form>
<div id="invite" hidden><span id="inviteTx"></span><button id="inviteGo">나가기</button><button class="x" id="inviteX" aria-label="닫기">닫기</button></div>

<div id="sub" aria-live="polite"><p><span class="who" id="who"></span><span id="line"></span></p></div>

<div id="actions" hidden>
  <button class="act" data-act="pour"><div class="ring"><svg viewBox="0 0 32 32"><g transform="rotate(-52 15 12)"><rect x="12" y="5" width="6.5" height="13" rx="2"/><path d="M13.6 5V2h3.3v3"/></g><path d="M22.5 17.5v3"/><path d="M17 22.5h10.5l-1.3 6.5h-7.9z"/></svg></div><span>술 따르기</span></button>
  <button class="act" data-act="drink"><div class="ring"><svg viewBox="0 0 32 32"><path d="M9 6h14l-2.2 20H11.2z"/><path d="M10.1 14h11.8"/><path d="M14 3.5c.6.8.6 1.5 0 2.2M18 3.5c.6.8.6 1.5 0 2.2"/></svg></div><span>술 마시기</span></button>
  <button class="act" data-act="smoke"><div class="ring"><svg viewBox="0 0 32 32"><rect x="4" y="21" width="21" height="4" rx=".6"/><path d="M20 21v4"/><path d="M27.5 21.5v3"/><path d="M23 17c-2-1.8 2-3.6 0-5.4s2-3.6 0-5.4"/></svg></div><span>담배 피기</span></button>
  <button class="act" data-act="confess"><div class="ring"><svg viewBox="0 0 32 32"><path d="M16 27s-10-6-10-12.6A5 5 0 0 1 16 12a5 5 0 0 1 10 2.4C26 21 16 27 16 27z"/></svg></div><span>사랑 고백</span></button>
</div>
<button class="ghost bottomBtn" id="sit" hidden></button>
<button class="ghost bottomBtn" id="goIn" hidden>안으로 들어가기</button>
<div id="joy" hidden><i></i></div>

<canvas id="dissolve" aria-hidden="true"></canvas>
<div id="place"></div>
<div id="fade"></div>

<div id="card">
  <div class="in">
    <h1>어느 밤, 술집</h1>
    <p class="sub">여덟 개의 테이블 · 열여섯 명의 사람 · 소주</p>
    <ul>
      <li><b>술 따르기</b> · 상대 잔을 채워요</li>
      <li><b>술 마시기</b> · 다 같이 건배</li>
      <li><b>담배 피기</b> · 가게 앞에서 속얘기</li>
      <li><b>사랑 고백</b> · 타이밍이 전부</li>
    </ul>
    <p class="how" id="how">WASD나 방향키로 걷고, 마우스로 끌어서 둘러봐요.<br>빈 의자 앞에서 E를 누르면 앉아요. T를 누르면 말할 수 있어요.</p>
    <label for="nick">가게에서 불릴 이름</label>
    <input id="nick" maxlength="10" autocomplete="off" placeholder="손님">
    <button class="start" id="start">가게로 들어가기</button>
    <p class="fine">지금 이 주소에 들어와 있는 사람들은 같은 가게에 있어요.<br>대사는 모두 이 공간을 위해 새로 쓴 것입니다.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="firebase-room.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const T = THREE, PI = Math.PI;
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touch = matchMedia('(pointer: coarse)').matches;
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

/* ───────────── 대사 ───────────── */
const PLAYER_LINES = {
  pour: ["한 잔 받으세요.","제가 따라드릴게요.","잔이 비었네요."],
  selfPour: ["…제가 따라 마실게요.","혼자 따를게요. 괜찮아요."],
  drink: [["건배해요.","저도 한 잔 할게요."],["좋다. 술이 좋네요.","마셔요, 그냥 마셔요."],["저 안 취했어요. 진짜예요.","왜 이렇게 다 좋지? 다 좋아요."]],
  empty: ["…잔이 비었네.","어, 비었다."],
  smoke: ["담배 한 대 피우실래요?","잠깐 바람 좀 쐬러 나갈래요?"],
  confess: [["저… 좋아하는 것 같아요.","이상하게 들리겠지만, 좋아요."],["좋아요. 진짜 좋아요. 그냥 좋아요.","저 사실 아까부터 좋았어요."],["너무 좋아요. 너무 좋아. 정말 너무 좋아요.","좋아하는 것 같아요, 제가. 많이요."]]
};
const OTHER_ON_CONFESS = ["…저 잠깐 화장실 좀.","와, 진짜. 여기서 그런 말을 해요?","하하… 두 분이 얘기하세요.","나는 안 들은 걸로 할게요."];
const REJOIN = [[0,"어, 다시 오셨네요."],[1,"앉으세요. 아까 그 얘기 하던 중이었어요."],[0,"무슨 얘기였더라… 아, 그 얘기."]];
const NPC_POURS_YOU = ["잔 비었네. 받아요.","빈 잔 보면 못 참아요. 받으세요.","자, 한 잔. 사양 마요.","잔이 비면 마음도 비어요. 받아요."];
const NPC_ON_SELFPOUR = ["아이, 왜 혼자 따라요. 말을 하지.","자작하면 앞사람 삼 년 재수 없대요.","말하지. 따라줬을 텐데."];
const NPC_ON_PERSON = ["어, 아는 사이예요?","두 분 친해 보이네요.","우리도 끼워줘요."];

const TABLES = [
{ title:"감독과 후배", desc:"영화감독 선배와 배우 지망생", pos:[2.5,-2],
  chars:[
  { name:"성준", role:"영화감독", look:{coat:0x6e2a22, hair:0x161210, pants:0x1e1c1f},
    pour:[["아이고, 고마워요. 젊은 사람이 예의가 있네.","어, 받을게. 받아야지."],["좋다. 이렇게 따라주니까 좋다. 진짜 좋다.","당신 좋은 사람이야. 내가 보면 알아."],["더 줘. 오늘은 그냥 다 마실 거야. 다.","나 취한 거 아니야. 이제 시작이야~"]],
    drink:[["잘 마시네. 술 잘 마시는 사람 좋아.","원샷? 아이고, 그렇게 마시면 안 돼요."],["건배! 건배. 우리 이 순간을 위해서.","술은 따지면서 마시는 거 아니야. 그냥 마시는 거지~"],["마셔. 마시고 다 잊어버려. 나도 잊을 거야.","인생 별거 없어. 별거 없는데 왜 이렇게 힘드냐."]],
    smoke:["밖에 나오니까 좀 살겠다. 안에선 내가 계속 떠들잖아.","사실 나 요즘 하나도 못 찍어. 아무도 몰라. 은희도 몰라.","재능 있다는 말, 그거 사실 나한테 해주는 말이야. 나한테."],
    low:["어… 그래요? 고마워요. 근데 우리 오늘 처음 봤잖아.","하하, 농담이지? 농담이면 재밌다."],

function animDrink(t, s, person, opts={}){
  const G=s.glass, cheers=!!opts.cheers, dur=cheers?2.9:2.1, start=G.level;
  const rest=G.rest.clone(), mouth=mouthLocal(t,s);
  const mid=new T.Vector3(s.x*.35, 1.04, s.z*.32 + (Math.random()-.5)*.05);
  const tiltSign=-Math.cos(s.ry);
  const arm=person&&person.arms[1];
  if(person===player){ setTimeout(()=>{ zoomOn(player); rig.tZoom=.8; S.zoomHold=performance.now()+2400; }, cheers?700:100); }
  const tl = cheers ? {up:[0,.18], clink:.2, hold:[.18,.3], toMouth:[.3,.45], sip:[.45,.68], back:[.72,1]} : {up:[0,0], clink:-1, hold:[0,0], toMouth:[0,.26], sip:[.28,.62], back:[.66,1]};
  let clinked=false, gulped=false, tilted=false;
  play(dur, k=>{
    const p=G.g.position;
    if(k<tl.toMouth[0]){ const e=ease(seg(k,tl.up[0],tl.up[1])); p.lerpVectors(rest,mid,e); if(arm) arm.rotation.x=-1.1-e*.6; }
    else if(k<tl.back[0]){ const e=ease(seg(k,tl.toMouth[0],tl.toMouth[1])); p.lerpVectors(cheers?mid:rest,mouth,e); if(arm) arm.rotation.x=-1.1-(cheers?.6:0)-e*(cheers?.9:1.5);
      const sk=seg(k,tl.sip[0],tl.sip[1]); G.g.rotation.x=tiltSign*1.9*ease(sk); G.set(start*(1-sk));
      if(sk>0&&!tilted&&person){ person.tiltUntil=performance.now()+(tl.sip[1]-tl.sip[0])*dur*1000; tilted=true; }
      if(sk>.5&&!gulped){ gulped=true; G.g.getWorldPosition(tmpA); sfxGulp(tmpA); }
    } else { const e=ease(seg(k,tl.back[0],tl.back[1])); p.lerpVectors(mouth,rest,e); G.g.rotation.x=tiltSign*1.9*(1-e); if(arm) arm.rotation.x=-2.6+e*1.5; }
    if(cheers&&!clinked&&k>=tl.clink){ clinked=true; if(!opts.silent){ G.g.getWorldPosition(tmpA); sfxClink(tmpA); } }
  }, ()=>{ G.g.position.copy(rest); G.g.rotation.set(0,0,0); G.set(0); if(arm&&person.seated) arm.rotation.set(-1.1,0,0); if(opts.done) opts.done(); });
}
function animPour(t, fromSeat, toSeat, person, opts={}){
  const G=toSeat.glass, start=G.level, hb=t.hb, st=t.stream;
  const home=new T.Vector3(fromSeat.x*.55,.79,fromSeat.z*.25);
  const toward=new T.Vector3(fromSeat.x-toSeat.x,0,fromSeat.z-toSeat.z);
  if(toward.lengthSq()<1e-4) toward.set(0,0,toSeat.z>0?1:-1); toward.normalize();
  const above=G.rest.clone().addScaledVector(toward,.31); above.y=1.11;
  const dirToGlass=toward.clone().negate();
  const axis=new T.Vector3().crossVectors(T.Object3D.DefaultUp,dirToGlass).normalize();
  const q=new T.Quaternion(), tip=V(), glassTop=V(), mid=V(), d=V();
  const arm=person&&person.arms[1];
  let sounded=false;
  hb.visible=true; hb.scale.setScalar(1.25); hb.position.copy(home); hb.quaternion.identity();
  if(S.table===t.ti&&S.mode==='seated'){ G.g.getWorldPosition(rig.focus); rig.focus.y+=.06; rig.tZoom=.72; S.zoomHold=performance.now()+2600; }
  play(2.4, k=>{
    const go=ease(seg(k,0,.22)), tilt=ease(seg(k,.22,.36))*(1-ease(seg(k,.8,.9))), back=ease(seg(k,.9,1));
    hb.position.lerpVectors(home,above,go*(1-back)); hb.position.y+=Math.sin(go*PI)*.06;
    q.setFromAxisAngle(axis, tilt*1.9); hb.quaternion.copy(q);
    if(arm) arm.rotation.x=-1.1-go*(1-back)*.55;
    const flowing=k>.36&&k<.8;
    if(flowing){
      tip.set(0,.33,0).applyQuaternion(q).add(hb.position);
      glassTop.copy(G.rest); glassTop.y+=.08;
      d.subVectors(glassTop,tip); const len=Math.max(.01,d.length());
      mid.addVectors(tip,glassTop).multiplyScalar(.5);
      st.visible=true; st.position.copy(mid); st.scale.set(1,len,1); st.quaternion.setFromUnitVectors(T.Object3D.DefaultUp,d.normalize());
      G.set(start+(1-start)*seg(k,.4,.78));
      if(!sounded){ sounded=true; hb.getWorldPosition(tmpA); sfxPour(1.0,tmpA); }
    } else st.visible=false;
  }, ()=>{ hb.visible=false; st.visible=false; G.set(1); if(arm&&person.seated) arm.rotation.set(-1.1,0,0); if(opts.done) opts.done(); });
}

  if(S.walkOut||S.table===null){ S.walkOut=false; player.stand(false); player.g.position.set(0,.88,RD-1.0); player.g.rotation.set(0,PI,0); rig.yaw=0; dissolve(); cut(); S.mode='walk'; setBusy(false); setHUD(); pub(true); return; }
  const t=tables[S.table], npc=S.outWith, s=t.seats[S.seat];
  if(npc){ t.grp.add(npc.g); npc.g.position.set(npc.home.x,.53,npc.home.z); npc.g.rotation.set(0,npc.home.ry,0); npc.sit(); }
  t.grp.add(player.g); player.g.position.set(s.x,.53,s.z); player.g.rotation.set(0,s.ry,0); player.sit();
  S.mode='seated'; seatShot(t); cut(); zoomOut(); setHUD(); pub(true);
  await sleep(700);
  if(npc){ const other=t.npcs.find(p=>p!==npc);
    say(other,pick(["둘이 무슨 얘기 했어요?","오래 걸리셨네.","담배 냄새 난다."]),{tb:t,to:npc});
    say(npc,pick(["아무 얘기도 안 했어요.","그냥… 바람 쐬었어요.","별 얘기 아니에요."]),{tb:t,to:other}); }
  S.lastAct=performance.now();
}
function ambientTalk(t,far){
  const st=stageOf((t.npcs[0].drunk+t.npcs[1].drunk)/2), pool=t.d.ambient[st], ex=pool[t.amb[st]%pool.length]; t.amb[st]++;
  ex.forEach(([i,txt])=>say(t.npcs[i],txt,{tb:t,far,to:t.npcs[1-i],zoom:!far&&st===2&&i===1&&Math.random()<.35}));
  t.npcs.forEach(p=>p.drunk=Math.min(10,p.drunk+.35));
}
// tables keep drinking on their own
function backgroundDrinking(t,now){
  if(t.npcs.length<2) return;
  if(now<t.nextBg||now<t.busyUntil) return;
  t.nextBg=now+9000+Math.random()*12000;
  if(S.outWith&&t.npcs.includes(S.outWith)) return;
  const [a,b]=t.npcs, ea=a.home.glass.level<.05, eb=b.home.glass.level<.05;
  t.busyUntil=now+3200;
  if(ea||eb){ const from=ea?b:a, to=ea?a:b; animPour(t,from.home,to.home,from); }
  else if(Math.random()<.55){ animDrink(t,a.home,a,{cheers:true}); setTimeout(()=>animDrink(t,b.home,b,{cheers:true,silent:true}),90); a.drunk=Math.min(10,a.drunk+.4); b.drunk=Math.min(10,b.drunk+.4); }
  else { const n=Math.random()<.5?a:b; animDrink(t,n.home,n,{}); }
}
let bw=store.get('hb-bw')==='1';
function drunkFx(){ const f=[]; if(bw) f.push('grayscale(1) contrast(1.12) brightness(1.05)'); if(S.pd>1){ f.push(`blur(${Math.min(1.4,S.pd*.13).toFixed(2)}px)`); if(!bw) f.push(`saturate(${(1+S.pd*.04).toFixed(2)})`); } canvas.style.filter=f.join(' '); disImg.style.filter=canvas.style.filter; }

/* ───────────── 디졸브 ───────────── */
const disImg=$('#dissolve'), disCtx=disImg.getContext('2d');
function dissolve(){
  if(reduce) return;
  try{
    renderer.render(scene,camera);
    disImg.width=canvas.width; disImg.height=canvas.height;
    disCtx.drawImage(canvas,0,0);
    disImg.style.transition='none'; disImg.style.opacity='1'; void disImg.offsetWidth;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ disImg.style.transition='opacity 1.3s ease'; disImg.style.opacity='0'; }));
  }catch(e){}
}

/* ───────────── 조는 사람 ───────────── */
const DOZE_LINES=["…아, 잠깐 졸았다.","방금 꿈꿨어요. 바다였는데… 아무도 없었어요.","자는 거 아니에요. 눈만 감은 거예요.","꿈에 누가 나왔는데. 누구였더라."];
function dozeTick(tb,dt){
  tb.npcs.forEach(p=>{
    if(p.drunk<8){ p.dozing=false; return; }
    if(Math.random()<dt*.05){ const was=p.dozing; p.dozing=!p.dozing;
      if(was&&S.table===tb.ti&&S.mode==='seated'&&!S.cur&&!S.queue.length) say(p,pick(DOZE_LINES),{tb}); }
  });
}

/* ───────────── 입력 ───────────── */
const keys=new Set(), joyV={x:0,y:0};
addEventListener('keydown',e=>{
  if(S.mode==='intro'||e.target===chatIn||e.target===$('#nick')) return;
  if(e.code==='KeyT'||(e.code==='Enter'&&S.mode!=='outside')){ e.preventDefault(); openChat(); return; }
  keys.add(e.code);
  const k={Digit1:'pour',Digit2:'drink',Digit3:'smoke',Digit4:'confess'}[e.code]; if(k) act(k);
  if(e.code==='KeyE'&&S.mode==='walk') sitDown(S.near);
  if(e.code==='Escape'||e.code==='KeyQ') standUp();
  if(e.code==='Enter'&&S.mode==='outside') goInside();
  if(e.code.startsWith('Arrow')||e.code==='Space') e.preventDefault();
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
btns.forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));
$('#leave').onclick=()=>standUp(); $('#goIn').onclick=goInside; $('#sit').onclick=()=>sitDown(S.near);
$('#inviteGo').onclick=()=>joinSmoke(inviteFrom); $('#inviteX').onclick=()=>{ $('#invite').hidden=true; inviteFrom=null; };
$('#bwBtn').onclick=e=>{ bw=!bw; store.set('hb-bw',bw?'1':'0'); e.currentTarget.setAttribute('aria-pressed',String(bw)); dissolve(); drunkFx(); };
$('#bwBtn').setAttribute('aria-pressed',String(bw));
$('#soundBtn').onclick=e=>{ muted=!muted; audio(); if(master) master.gain.setTargetAtTime(muted?0:1,AC.currentTime,.05); e.currentTarget.textContent=muted?'소리 끔':'소리 켬'; e.currentTarget.setAttribute('aria-pressed',String(!muted)); };
function start(){ drunkFx(); audio(); startRoomTone(); S.nick=clean($('#nick').value,10).trim()||'손님'; store.set('hb-nick',S.nick); audio(); $('#card').classList.add('out'); S.mode='walk'; setHUD(); pub(true); }
$('#start').onclick=start; $('#nick').addEventListener('keydown',e=>{ if(e.key==='Enter') start(); });
let drag=null;
canvas.addEventListener('pointerdown',e=>{ if(S.mode!=='walk') return; drag={id:e.pointerId,x:e.clientX,y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; rig.yaw-=(e.clientX-drag.x)*.0055; rig.pitch=Math.max(.05,Math.min(.75,rig.pitch+(e.clientY-drag.y)*.004)); drag.x=e.clientX; drag.y=e.clientY; });
const endDrag=e=>{ if(drag&&e.pointerId===drag.id) drag=null; };
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
const joy=$('#joy'), knob=joy.querySelector('i'); let joyId=null;
joy.addEventListener('pointerdown',e=>{ joyId=e.pointerId; joy.setPointerCapture(e.pointerId); moveJoy(e); });
joy.addEventListener('pointermove',e=>{ if(e.pointerId===joyId) moveJoy(e); });
const endJoy=e=>{ if(e.pointerId!==joyId) return; joyId=null; joyV.x=joyV.y=0; knob.style.transform=''; };
joy.addEventListener('pointerup',endJoy); joy.addEventListener('pointercancel',endJoy);
function moveJoy(e){ const r=joy.getBoundingClientRect(); let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2); const m=Math.hypot(dx,dy), R=r.width/2-12; if(m>R){ dx*=R/m; dy*=R/m; } knob.style.transform=`translate(${dx}px,${dy}px)`; joyV.x=dx/R; joyV.y=dy/R; }

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; rig.fov=w<h?68:55; camera.fov=rig.fov; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

function collide(p,r=.28){
  for(const [x0,x1,z0,z1] of blockers){
    const cx=Math.max(x0,Math.min(p.x,x1)), cz=Math.max(z0,Math.min(p.z,z1));
    const dx=p.x-cx, dz=p.z-cz, d2=dx*dx+dz*dz;
    if(d2<r*r){ if(d2>1e-8){ const d=Math.sqrt(d2), k=(r-d)/d; p.x+=dx*k; p.z+=dz*k; } else {
      const o=[p.x-x0+r, x1-p.x+r, p.z-z0+r, z1-p.z+r], m=Math.min(...o);
      if(m===o[0]) p.x=x0-r; else if(m===o[1]) p.x=x1+r; else if(m===o[2]) p.z=z0-r; else p.z=z1+r; } }
  }
}

/* ───────────── 루프 ───────────── */
const clock=new T.Clock(), tmp=new T.Vector3(), tmp2=new T.Vector3(), lookV=new T.Vector3(), mv=new T.Vector3();
rig.tPos.copy(rig.pos); rig.tLook.copy(rig.look);
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime, now=performance.now();
  const pp=player.g.position;

  if(S.mode==='walk'){
    let fx=0, fz=0;
    if(keys.has('KeyW')||keys.has('ArrowUp')) fz+=1; if(keys.has('KeyS')||keys.has('ArrowDown')) fz-=1;
    if(keys.has('KeyD')||keys.has('ArrowRight')) fx+=1; if(keys.has('KeyA')||keys.has('ArrowLeft')) fx-=1;
    fx+=joyV.x; fz-=joyV.y;
    const m=Math.min(1,Math.hypot(fx,fz));
    if(m>.08){
      const fwx=-Math.sin(rig.yaw), fwz=-Math.cos(rig.yaw), rx=Math.cos(rig.yaw), rz=-Math.sin(rig.yaw);
      mv.set(fwx*fz+rx*fx, 0, fwz*fz+rz*fx).normalize();
      if(S.pd>2){ mv.applyAxisAngle(T.Object3D.DefaultUp,Math.sin(t*1.7)*S.pd*.03); }
      const sp=(keys.has('ShiftLeft')?3.4:2.1)*m;
      pp.x+=mv.x*sp*dt; pp.z+=mv.z*sp*dt; collide(pp);
      const face=Math.atan2(mv.x,mv.z); let d=face-player.g.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); player.g.rotation.y+=d*Math.min(1,dt*10);
      player.walkPh+=dt*sp*4.2; player.walkPose(player.walkPh,1); pub();
    } else { player.walkPh*=.85; player.walkPose(player.walkPh,0); }
    const dist=3.0, cp=Math.cos(rig.pitch), sp2=Math.sin(rig.pitch);
    rig.tPos.set(pp.x+Math.sin(rig.yaw)*dist*cp, .9+sp2*dist+.55, pp.z+Math.cos(rig.yaw)*dist*cp);
    if(pp.z<RD){ rig.tPos.x=Math.max(-RW+.25,Math.min(RW-.25,rig.tPos.x)); rig.tPos.z=Math.max(-RD+.25,Math.min(RD-.15,rig.tPos.z)); rig.tPos.y=Math.min(3.0,rig.tPos.y); }
    else { rig.tPos.z=Math.max(RD+.25,rig.tPos.z); }
    rig.tLook.set(pp.x,1.35,pp.z);
    const n=nearestFreeSeat(); S.near=n; const sit=$('#sit');
    if(n){ sit.hidden=false; const html=`<b>앉기</b>${touch?'':'<kbd>E</kbd>'}<small>${n.t.d.title}</small>`; if(sit.dataset.k!==html){ sit.innerHTML=html; sit.dataset.k=html; } } else sit.hidden=true;
    let ht=null, hd=2.7; tables.forEach(tb=>{ if(!tb.npcs.length) return; const d=Math.hypot(tb.d.pos[0]-pp.x, tb.d.pos[1]-pp.z); if(d<hd){ hd=d; ht=tb; } });
    if(S.cur&&S.cur.far&&S.cur.tb!==ht) clearTalk();
    if(ht&&!S.cur&&!S.queue.length&&now-S.lastHear>1800&&now>S.gapUntil){ ambientTalk(ht,true); S.lastHear=now; }
  }

  if(S.cur&&now>S.cur.end){ endLine(); if(S.mode==='walk') S.lastHear=now; }
  if(!S.cur&&S.queue.length&&now>S.gapUntil) showLine(S.queue.shift());
  if(S.mode==='seated'&&!S.cur&&!S.queue.length&&S.busy&&!S.leaving&&now>tables[S.table].busyUntil){ setBusy(false); S.lastAct=now; renderChips(); updateMyGlass(); }
  if(S.mode==='seated'&&!S.busy&&!S.cur&&!S.queue.length&&now-S.lastAct>6500){
    const t=tables[S.table], mine=t.seats[S.seat];
    if(!t.npcs.length){ /* quiet table */ }
    else if(mine.glass.level<.05&&Math.random()<.6&&now>t.busyUntil){ const n=t.npcs[Math.random()<.5?0:1]; setBusy(true); say(n,pick(NPC_POURS_YOU),{tb:t,to:player}); t.busyUntil=now+3000; setTimeout(()=>animPour(t,n.home,mine,n,{done:updateMyGlass}),700); }
    else { setBusy(true); ambientTalk(t,false); }
    S.lastAct=now;
  }
  if(S.mode==='seated'&&!S.busy){ const tb=now<tables[S.table].busyUntil; if(btns[0].disabled!==tb) btns.forEach(b=>b.disabled=tb); }
  if(rig.tZoom>0&&now>S.zoomHold&&!S.cur) zoomOut();

  tables.forEach(tb=>{
    backgroundDrinking(tb,now);
    if(S.cur&&S.cur.tb===tb) return;
    if(!tb.npcs.length) return;
    dozeTick(tb,dt);
    tb.idleTalk-=dt; if(tb.idleTalk<=0){ tb.idleWho=1-tb.idleWho; tb.idleTalk=2+Math.random()*3; tb.npcs.forEach(p=>p.speaking=false); tb.npcs[tb.idleWho].speaking=true; tb.npcs.forEach((p,i)=>p.lookAt=tb.npcs[1-i]); }
    tb.light.intensity=1.6+Math.sin(t*7+tb.ti)*.03;
  });

  for(let i=anims.length-1;i>=0;i--){ const a=anims[i], k=Math.min(1,(now-a.t0)/(a.dur*1000)); a.update(k); if(k>=1){ anims.splice(i,1); a.done&&a.done(); } }

  // other people walking around
  remotes.forEach(r=>{
    const p=r.p;
    if(r.pose==='walk'&&p.g.parent===scene){
      const dx=r.tx-p.g.position.x, dz=r.tz-p.g.position.z, dd=Math.hypot(dx,dz);
      if(dd>4){ p.g.position.x=r.tx; p.g.position.z=r.tz; }
      else { p.g.position.x+=dx*Math.min(1,dt*9); p.g.position.z+=dz*Math.min(1,dt*9); }
      let d=r.ry-p.g.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); p.g.rotation.y+=d*Math.min(1,dt*10);
      if(dd>.03){ r.walkPh+=dt*9; p.walkPose(r.walkPh,1); } else p.walkPose(0,0);
    }
  });

  everyone().forEach(p=>{
    let yawT=0;
    if(p.lookAt&&p.lookAt!==p){ p.lookAt.head.getWorldPosition(tmp); p.g.updateMatrixWorld(); p.g.worldToLocal(tmp); yawT=Math.max(-.75,Math.min(.75,Math.atan2(tmp.x,tmp.z))); }
    p.yaw+=(yawT-p.yaw)*Math.min(1,dt*4); p.head.rotation.y=p.yaw;
    const tl=now<p.tiltUntil?-.55:(p.dozing?.5:0); p.tilt+=(tl-p.tilt)*Math.min(1,dt*6); p.head.rotation.x=p.tilt;
    p.head.position.y=.76+(p.speaking?Math.abs(Math.sin(t*9+p.phase))*.012:Math.sin(t*1.3+p.phase)*.003);
    if(p!==player) p.g.rotation.z=Math.sin(t*.9+p.phase)*(p.drunk||0)*.004;
    if(p.cig.visible&&Math.random()<dt*3){ p.cig.getWorldPosition(tmp2); tmp2.y+=.02; emit(tmp2); }
  });
  puffs.forEach(p=>{ if(p.life<=0) return; p.life-=dt; p.s.position.y+=dt*.22; p.s.position.x+=p.vx*dt; const k=1-p.life/3.2; p.s.scale.setScalar(.06+k*.5); p.s.material.opacity=Math.max(0,.5*(1-k)); if(p.life<=0) p.s.visible=false; });

  if(S.mode==='intro'){ rig.tPos.set(Math.sin(t*.05)*3, 2.6, RD-.6); rig.tLook.set(0,1.0,0); }
  const k=1-Math.exp(-dt*(S.mode==='walk'?8:2.2)); rig.pos.lerp(rig.tPos,k); rig.look.lerp(rig.tLook,k);
  rig.zoom+=(rig.tZoom-rig.zoom)*(1-Math.exp(-dt*(reduce?8:1.7)));
  camera.position.copy(rig.pos);
  const sw=reduce?0:Math.min(.06,S.pd*.006);
  camera.position.x+=Math.sin(t*.7)*sw; camera.position.y+=Math.sin(t*1.1)*sw*.6;
  lookV.copy(rig.look).lerp(rig.focus,rig.zoom*.8); camera.lookAt(lookV);
  const fovT=rig.fov-rig.zoom*rig.fov*.5; if(Math.abs(camera.fov-fovT)>.01){ camera.fov=fovT; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();

  const w=innerWidth,h=innerHeight;
  if(S.mode==='walk'){ tables.forEach((tb,i)=>{ const d=Math.hypot(tb.d.pos[0]-pp.x,tb.d.pos[1]-pp.z); tmp.set(tb.d.pos[0],1.75,tb.d.pos[1]).project(camera); const vis=tmp.z<1&&d<6.5; labels[i].style.opacity=vis?Math.max(0,Math.min(1,(6.5-d)/2)):0; if(vis){ labels[i].style.left=((tmp.x*.5+.5)*w)+'px'; labels[i].style.top=((-tmp.y*.5+.5)*h)+'px'; } }); }
  remotes.forEach(r=>{
    r.p.head.getWorldPosition(tmp); const d=tmp.distanceTo(camera.position); tmp.y+=.3; tmp.project(camera);
    const vis=S.mode!=='intro'&&tmp.z<1&&d<14; r.tag.hidden=!vis;
    if(vis){ r.tag.style.left=((tmp.x*.5+.5)*w)+'px'; r.tag.style.top=((-tmp.y*.5+.5)*h)+'px'; const pl=r.tag.querySelector('p'); const showL=now<r.lineUntil&&d<9; if(showL&&pl.textContent!==r.line) pl.textContent=r.line; pl.hidden=!showL; }
  });

  renderer.render(scene,camera);
}
setHUD();
const fontsReady=document.fonts?Promise.all([document.fonts.load('700 30px "Gowun Batang"'),document.fonts.load('20px "Gowun Dodum"')]):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2000))]).then(buildSigns);
initRoom();
frame();
})();
</script>
